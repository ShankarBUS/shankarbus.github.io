<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShankarBUS</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="https://avatars.githubusercontent.com/ShankarBUS">
</head>

<body>
    <div class="dotted-background"></div>
    <div class="overlay-background"></div>
    <div id="smokeBackground" class="nav-smoke-background"></div>
    <header id="pageHeader" class="page-header">
        <button class="hamburger" id="hamburgerMenu">
            <div></div>
            <div></div>
            <div></div>
        </button>
        <img src="https://avatars.githubusercontent.com/ShankarBUS" alt="ShankarBUS" class="avatar">
        <label>ShankarBUS</label>
        <nav id="navBar" class="navbar">
            <ul id="navList" class="navlist">
                <li><a href="#basic-info">Basic Info</a></li>
                <li><a href="#education">Education</a></li>
                <li><a href="#achievements">Achievements</a></li>
                <li><a href="#socials">Socials</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#github-stats">GitHub Stats</a></li>
                <li><a href="#renders">Renders</a></li>
            </ul>
        </nav>
    </header>
    <div id="main">
        <div class="column">
            <div class="group">
                <h2 id="basic-info">Basic Info</h2>
                <div id="biodataContainer" class="dataContainer"></div>
            </div>
            <div class="group">
                <h2 id="education">Education</h2>
                <div id="educationContainer" class="dataContainer"></div>
            </div>
            <div class="group">
                <h2 id="achievements">Achievements</h2>
                <div id="achievementsContainer" class="dataContainer"></div>
            </div>
            <div class="group">
                <h2 id="socials">Socials</h2>
                <div id="socialsContainer" class="dataContainer"></div>
            </div>
            <div class="group">
                <h2 id="sites">Sites</h2>
                <div id="sitesContainer" class="dataContainer"></div>
            </div>
            <div class="group">
                <h2 id="skills">Skills</h2>
                <div class="sub-group">
                    <h3>Tech</h3>
                    <div id="tsBadgeArea" class="badge-area"></div>
                </div>
                <div class="sub-group">
                    <h3>Programming</h3>
                    <div id="psBadgeArea" class="badge-area"></div>
                </div>
            </div>
        </div>
        <div class="column column-2">
            <div class="group">
                <h2 id="github-stats">GitHub Stats</h2>
                <div class="sub-group gh">
                    <h3>Organizations</h3>
                    <div id="orgsContainer" class="cards-grid"></div>
                </div>
                <div class="sub-group gh">
                    <h3>Projects</h3>
                    <div id="projectsContainer" class="cards-grid"></div>
                </div>
                <div id="ghLoadFailed" class="gh-error-message">Can't get data from GitHub.
                    Please try some time later.</div>
                <div id="ghLoadingProgressBar" class="loading-progress-bar" aria-hidden="true"></div>
            </div>
            <div class="group">
                <h2 id="renders">Renders</h2>
                <p>Made in Blender.</p>
                <div id="rendersContainer" class="cards-grid"></div>
            </div>
        </div>
    </div>
    <div id="imageViewerPopup" class="popup" aria-hidden="true">
        <div id="imageViewerContent">
            <button id="closeImageViewer" aria-label="Close Viewer" class="image-close-button">
                <svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                    <path class="svg-path" d="M2.58859 2.71569L2.64645 2.64645C2.82001 2.47288 3.08944 2.4536 3.28431 2.58859L3.35355 2.64645L8 7.293L12.6464 2.64645C12.8417 2.45118 13.1583 2.45118 13.3536 2.64645C13.5488 2.84171 13.5488 3.15829 13.3536 3.35355L8.707 8L13.3536 12.6464C13.5271 12.82 13.5464 13.0894 13.4114 13.2843L13.3536 13.3536C13.18 13.5271 12.9106 13.5464 12.7157 13.4114L12.6464 13.3536L8 8.707L3.35355 13.3536C3.15829 13.5488 2.84171 13.5488 2.64645 13.3536C2.45118 13.1583 2.45118 12.8417 2.64645 12.6464L7.293 8L2.64645 3.35355C2.47288 3.17999 2.4536 2.91056 2.58859 2.71569L2.64645 2.64645L2.58859 2.71569Z" />
                  </svg>
            </button>
            <button id="prevImage" aria-label="Previous Image" class="image-nav-button prev">
                <svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                    <path class="svg-path" d="M9.42796 11.8398C10.091 12.2982 10.999 11.8267 10.999 11.0239V4.97512C10.999 4.17238 10.091 3.70084 9.42796 4.15925L5.64354 6.77573C4.78567 7.36885 4.78567 8.63021 5.64354 9.22333L9.42796 11.8398Z" />
                  </svg>
            </button>
            <button id="nextImage" aria-label="Next Image" class="image-nav-button next">
                <svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                    <path class="svg-path" d="M7.57107 11.8398C6.90803 12.2982 6 11.8267 6 11.0239V4.97512C6 4.17238 6.90803 3.70084 7.57106 4.15925L11.3555 6.77573C12.2133 7.36885 12.2134 8.63021 11.3555 9.22333L7.57107 11.8398Z" />
                  </svg>
            </button>
            <div id="imageContainer" class="image-container">
                <img id="imageViewerImage" src="" alt="Render Image">
            </div>
            <div id="imageViewerDetails">
                <h3 id="imageTitle"></h3>
                <p id="imageDescription"></p>
            </div>
        </div>
    </div>
    <script type="module" src="script.js"></script>
</body>

</html>
