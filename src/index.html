<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShankarBUS</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="https://avatars.githubusercontent.com/ShankarBUS">
</head>

<body>
    <header id="header">
        <img src="https://avatars.githubusercontent.com/ShankarBUS" alt="ShankarBUS" class="avatar">
        <h1>ShankarBUS</h1>
        <!-- <nav id="navBar" class="navbar">
            <ul id="navList" class="navlist">
                <li><a href="#basic-info">Basic Info</a></li>
                <li><a href="#education">Education</a></li>
                <li><a href="#achievements">Achievements</a></li>
                <li><a href="#socials">Socials</a></li>
                <li><a href="#sites">Sites</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#github-stats">GitHub Stats</a></li>
                <li><a href="#renders">Renders</a></li>
            </ul>
        </nav> -->
    </header>
    <main id="mainContent">
        <div class="column">
            <div class="group">
                <h2 id="basic-info">Basic Info</h2>
                <div id="biodataContainer" class="dataContainer"></div>
            </div>
            <div class="group">
                <h2 id="education">Education</h2>
                <div id="educationContainer" class="dataContainer"></div>
            </div>
            <div class="group">
                <h2 id="achievements">Achievements</h2>
                <div id="achievementsContainer" class="dataContainer"></div>
            </div>
            <div class="group">
                <h2 id="socials">Socials</h2>
                <div id="socialsContainer" class="dataContainer"></div>
            </div>
            <div class="group">
                <h2 id="sites">Sites</h2>
                <div id="sitesContainer" class="dataContainer"></div>
            </div>
            <div class="group">
                <h2 id="skills">Skills</h2>
                <div class="sub-group">
                    <h3>Tech</h3>
                    <div id="tsBadgeArea" class="badge-area"></div>
                </div>
                <div class="sub-group">
                    <h3>Programming</h3>
                    <div id="psBadgeArea" class="badge-area"></div>
                </div>
            </div>
        </div>
        <div class="column column-2">
            <div class="group">
                <h2 id="github-stats">GitHub Stats</h2>
                <div class="sub-group gh">
                    <h3>Organizations</h3>
                    <div id="orgsContainer" class="cards-grid"></div>
                </div>
                <div class="sub-group gh">
                    <h3>Projects</h3>
                    <div id="projectsContainer" class="cards-grid"></div>
                </div>
                <div id="ghLoadFailed" class="gh-error-message">Can't get data from GitHub.
                    Please try some time later.</div>
                <div id="ghLoadingProgressBar" class="loading-progress-bar" aria-hidden="true"></div>
            </div>
            <div class="group">
                <h2 id="renders">Renders</h2>
                <p>Made in Blender.</p>
                <div id="rendersContainer" class="cards-grid img-grid"></div>
            </div>
        </div>
    </main>
    <dialog id="imageViewerDialog" class="image-viewer" aria-modal="true" role="dialog">
        <div id="imageViewerContent">
            <button id="closeImageViewer" aria-label="Close Viewer" class="modal-close"></button>
            <button id="prevImage" aria-label="Previous Image" class="image-nav-button prev">
                <svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                    <path fill="currentColor" d="M9.42796 11.8398C10.091 12.2982 10.999 11.8267 10.999 11.0239V4.97512C10.999 4.17238 10.091 3.70084 9.42796 4.15925L5.64354 6.77573C4.78567 7.36885 4.78567 8.63021 5.64354 9.22333L9.42796 11.8398Z" />
                  </svg>
            </button>
            <button id="nextImage" aria-label="Next Image" class="image-nav-button next">
                <svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                    <path fill="currentColor" d="M7.57107 11.8398C6.90803 12.2982 6 11.8267 6 11.0239V4.97512C6 4.17238 6.90803 3.70084 7.57106 4.15925L11.3555 6.77573C12.2133 7.36885 12.2134 8.63021 11.3555 9.22333L7.57107 11.8398Z" />
                  </svg>
            </button>
            <div id="imageContainer" class="image-container">
                <img id="imageViewerImage" src="" alt="Render Image">
            </div>
            <div id="imageViewerDetails">
                <h3 id="imageTitle"></h3>
                <p id="imageDescription"></p>
            </div>
        </div>
    </dialog>
    <script type="module" src="script.js"></script>
</body>

</html>
