<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" width="device-width, initial-scale=1.0">
    <title>ShankarBUS</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="dotted-background"></div>
    <div class="overlay-background"></div>
    <header id="header" class="page-header">
        <img src="https://avatars.githubusercontent.com/ShankarBUS" alt="ShankarBUS" class="avatar">
        <label>ShankarBUS</label>
        <a href="#github-stats">GitHub Stats</a>
        <a href="#education">Education</a>
    </header>

    <section id="main-info">
        <div class="group">
            <h2 id="github-stats">GitHub Stats</h2>
            <div class="sub-group">
                <h3>Organizations</h3>
                <div id="orgsContainer" class="cards-grid"></div>
            </div>
            <div class="sub-group">
                <h3>Projects</h3>
                <div id="projectsContainer" class="cards-grid"></div>
            </div>
        </div>
        <div class="group">
            <h2 id="education">Education</h2>
        </div>
    </section>

    <script src="script.js"></script>
</body>

</html>
